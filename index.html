<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng ký 4G - Nhà mạng Việt Nam</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Đăng ký 4G</h1>
    <p class="subtitle">Chọn nhà mạng để mở SMS đăng ký (nội dung đã điền sẵn).</p>

    <div id="carrier-list" class="carrier-list"></div>

    <p class="note">
      * Trên điện thoại, nút sẽ mở ứng dụng SMS với số và nội dung điền sẵn.
      Bạn chỉ cần bấm <strong>Gửi</strong>. Trên máy tính, nút có thể không hoạt động.
    </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
